name: NEXA OHLCV public-data research (no trading)
on:
  push:
    branches:
      - research/nexa-ohlcv-20261119
    paths:
      - research/nexa_spot_ohlcv_2026.py
      - .github/workflows/nexa-market-research-2026.yml
  pull_request:
    branches:
      - main
    paths:
      - research/nexa_spot_ohlcv_2026.py
      - .github/workflows/nexa-market-research-2026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-public-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Download, checksum and resample public Binance Spot
        run: python research/nexa_spot_ohlcv_2026.py
      - name: Preserve historical dataset and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-public-5m-15m-1h-4h-2026Jul-Nov
          path: nexa_ohlcv_publico/
          retention-days: 30
          if-no-files-found: warn
