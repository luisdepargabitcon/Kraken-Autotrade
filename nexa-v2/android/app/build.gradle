// Signing credentials are supplied locally or by CI secrets. Never commit them.
def nexaSigning = [
  file: System.getenv('NXV2_KEYSTORE_PATH'),
  storePassword: System.getenv('NXV2_KEYSTORE_PASSWORD'),
  keyAlias: System.getenv('NXV2_KEY_ALIAS'),
  keyPassword: System.getenv('NXV2_KEY_PASSWORD'),
]
def nexaCanSignRelease = nexaSigning.values().every { it != null && it.trim() }

// Firma QA persistente (Rev24b): keystore dedicada en android/keystore/nexa-qa.jks
// (gitignored) + credenciales en android/local.properties o variables de entorno.
// Todas las APK QA comparten la misma firma → se actualizan entre sí sin
// conflictos. No es la clave de producción (expuesta, INC-021).
def nexaLocalProps = new Properties()
def nexaLpFile = rootProject.file('local.properties')
if (nexaLpFile.exists()) nexaLpFile.withInputStream { nexaLocalProps.load(it) }
def qaSigning = [
  file: System.getenv('NXV2_QA_KEYSTORE_PATH') ?: nexaLocalProps.getProperty('nxv2.qa.storeFile'),
  storePassword: System.getenv('NXV2_QA_KEYSTORE_PASSWORD') ?: nexaLocalProps.getProperty('nxv2.qa.storePassword'),
  keyAlias: System.getenv('NXV2_QA_KEY_ALIAS') ?: nexaLocalProps.getProperty('nxv2.qa.keyAlias'),
  keyPassword: System.getenv('NXV2_QA_KEY_PASSWORD') ?: nexaLocalProps.getProperty('nxv2.qa.keyPassword'),
]
def nexaCanSignQa = qaSigning.values().every { it != null && it.trim() } &&
  rootProject.file(qaSigning.file ?: 'keystore/__none__.jks').exists()

apply plugin: 'com.android.application'

android {
    signingConfigs {
        release {
            if (nexaCanSignRelease) {
                storeFile file(nexaSigning.file)
                storePassword nexaSigning.storePassword
                keyAlias nexaSigning.keyAlias
                keyPassword nexaSigning.keyPassword
            }
        }
        qa {
            if (nexaCanSignQa) {
                storeFile rootProject.file(qaSigning.file)
                storePassword qaSigning.storePassword
                keyAlias qaSigning.keyAlias
                keyPassword qaSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (nexaCanSignRelease) signingConfig signingConfigs.release
        }
    }
    namespace "com.nexa.autotrade.v2"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nexa.autotrade.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "0.9.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // QA builds install alongside the signed release: distinct package id
            // (com.nexa.autotrade.v2.qa) avoids the debug/release cert conflict.
            // -PnexaParallelId produce un paquete .qa2 para instalar en paralelo.
            applicationIdSuffix (project.hasProperty('nexaParallelId') ? ".qa2" : ".qa")
            versionNameSuffix "-qa"
            // Firma QA persistente si existe la keystore dedicada; si no, debug
            // estándar (CI). Nunca mezcla certificados entre orígenes.
            // -PhostDebugSign fuerza la debug.keystore del host (misma firma que
            // las QA locales antiguas) para actualizar instalaciones existentes.
            if (nexaCanSignQa && !project.hasProperty('hostDebugSign')) signingConfig signingConfigs.qa
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

gradle.taskGraph.whenReady { graph ->
    if (!nexaCanSignRelease && graph.allTasks.any { it.name in ['assembleRelease', 'packageRelease', 'bundleRelease'] }) {
        throw new GradleException('NEXA release signing: configure NXV2_KEYSTORE_PATH, NXV2_KEYSTORE_PASSWORD, NXV2_KEY_ALIAS and NXV2_KEY_PASSWORD in a secure local environment.')
    }
}
