<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEXA · Mesa de control</title><style>
*{box-sizing:border-box}body{--a:#82e4c3;--ink:#101f23;margin:0;background:#101c22;color:#f1f6f5;font:16px/1.5 system-ui,sans-serif}body.shadow{--a:#d6b2fa;background:#201c29}body.pro:not(.shadow){--a:#9ccaff;background:#111e2a}header,main,footer nav{max-width:750px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #73858a55}strong{letter-spacing:.14em}small,label{display:block;color:#b6c9ca}button,select{font:inherit;color:inherit;background:#233139;border:1px solid #667a8055;border-radius:8px;min-height:44px;padding:6px 10px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid orange}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(90px,100%),1fr));gap:4px;margin:10px 0 18px}.tabs button{font-size:14px}.active{color:var(--ink);background:var(--a);font-weight:700}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.055em;margin:.1em 0 .25em}h2{font-size:24px;margin:12px 0}main{padding-bottom:108px}.path{font-size:12px;letter-spacing:.1em;color:var(--a);text-transform:uppercase}.pane{background:#f3f4ec;color:#182929;padding:clamp(16px,4vw,32px);border-radius:14px;margin-top:16px;box-shadow:0 8px 24px #0002}.pane small{color:#47605e}.metric{font-size:clamp(30px,8vw,48px);font-weight:650;letter-spacing:-.06em}.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between;border-bottom:1px solid #b4c4be;padding:13px 0}.row b{text-align:right}.rail{height:10px;border-radius:10px;background:linear-gradient(90deg,#47a890,#cdd480,#e2a97b);position:relative;margin:23px 0 9px}.rail:after{content:'';position:absolute;left:58%;top:-5px;border:3px solid #162e2e;background:white;width:14px;height:14px;border-radius:50%}footer{position:fixed;bottom:0;left:0;right:0;background:#142128;border-top:1px solid #526469;padding-bottom:env(safe-area-inset-bottom)}footer nav{padding:5px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}footer button{border:0;background:none;padding:5px 0;font-size:12px}footer button i{display:block;font:21px system-ui}footer button.active{background:#293c42;color:var(--a)}svg{width:100%;display:block}dialog{width:min(340px,92vw);border:0;border-radius:12px;padding:20px}dialog::backdrop{background:#0009}dialog label{color:#345;margin:10px 0}select{width:100%;background:#fff;color:#172928}dialog button{width:100%}
footer{position:sticky;margin-top:auto}body{display:flex;flex-direction:column;min-height:100dvh}header,main{width:100%}main{flex:1;padding-bottom:24px}#ret{max-width:750px;margin:auto;display:flex;gap:8px;padding:0 8px}#ret button{font-size:14px;padding:6px 12px}footer nav button{overflow-wrap:anywhere}footer nav{gap:3px}body,body.pro:not(.shadow){--a:#93bfff;background:#080e19;color:#eef4ff}body.shadow{--a:#d2b6ff;background:#140f20}header,footer{background:#0d1625;border-color:#253752}header{padding:8px 14px;position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center}.brand button{background:none;border:0;padding:0;color:#b5c8df}.brand #back{width:44px;font:29px system-ui}.logo{font-weight:750;letter-spacing:.08em}.logo b{display:inline-grid;place-items:center;background:#1e487e;color:#a9cfff;border-radius:6px;width:24px;height:24px}.pane{background:linear-gradient(135deg,#192c46,#101d30);color:#eff5ff;border:1px solid #2b4260;box-shadow:none}.shadow .pane{background:linear-gradient(135deg,#32273f,#211c32)}.pane small,label{color:#aac0d9}.row{border-color:#35455c}.path{font-size:10px}.pane p{line-height:1.55}select,dialog{color:#f1f5fc;background:#15263b;border-color:#334b67}dialog label{color:#bfcee0}#settings{background:#15253a;border-color:#344960;font-size:14px}footer nav button{font-weight:550;color:#9fb2cc}footer nav button.active{background:#1e334e;color:var(--a);box-shadow:inset 0 2px var(--a)}.shadow footer nav button.active{background:#352943}h1{letter-spacing:-.04em}footer{z-index:1} .dock{display:flex;align-items:center;max-width:750px;margin:auto}.dock nav{flex:1;min-width:0;margin:0}.dock #back{width:44px;font-size:26px;color:#9ab1ce;flex:none}.switches,.switch{display:flex;align-items:center;gap:6px}.switches{flex-wrap:wrap;justify-content:flex-end}.switch{font-size:12px;position:relative;min-height:44px;cursor:pointer}.switch input{position:absolute;opacity:0}.switch i{width:25px;height:15px;border-radius:12px;background:#425673;position:relative}.switch i:after{content:'';position:absolute;top:3px;left:3px;width:9px;height:9px;border-radius:100%;background:white}.switch input:checked~i{background:#366ead}.switch input:checked~i:after{left:13px}.switch input:focus-visible~i{outline:2px solid white}.switch input:not(:checked)+span,.switch input:checked~span:last-child{color:#fff;font-weight:bold}.shadow #env~i{background:#855399}header{gap:8px;flex-wrap:wrap}</style><header><div class="brand"><button class="logo" aria-label="Volver a Inicio" title="Inicio" onclick="rootMenu()"><b>И</b> NEXA</button></div><div class="switches"><label class="switch"><input id="detail" type="checkbox" role="switch" aria-label="Básico o Pro" onchange="draw()"><span>Básico</span><i aria-hidden="true"></i><span>Pro</span></label><label class="switch"><input id="env" type="checkbox" role="switch" aria-label="Real o Shadow" onchange="draw()"><span>Real</span><i aria-hidden="true"></i><span>Shadow</span></label></div></header><main id="app"></main><footer><div class="dock"><button id="back" aria-label="Volver al nivel anterior" title="Atrás" onclick="up()">‹</button><nav id="nav" aria-label="Menú principal"></nav></div></footer><script>
const pages={Inicio:['Resumen','Posiciones','Conexión'],Mercado:['Precio','Gráfico','Niveles','Indicadores'],Modos:['General','IDCA','SPOT','GRID','AMA'],Cartera:['Resumen','Saldos','Activos','Movimientos','Reservas','Conciliación'],Actividad:['Recientes','Ejecuciones','Decisiones','Avisos']};
let section='Modos',chosen={Modos:'IDCA'},inner='Estado',asset='BTC',filter='Todos';
const names=Object.keys(pages),icons=['⌂','⌁','◈','▤','≋'];
function buttons(items,current,fn){return items.map((x,i)=>'<button aria-pressed="'+(x===current)+'" class="'+(x===current?'active':'')+'" onclick="'+fn+'('+i+')">'+x+'</button>').join('')}
function go(i){section=names[i];draw();scrollTo(0,0)}function sub(i){chosen[section]=available()[i];inner='Estado';draw()}function deeper(i){inner=levels()[i];draw()}function levels(){return detail.checked?['Estado','Posiciones','Historial','Órdenes']:['Estado','Posiciones']}
function available(){let a=pages[section];return detail.checked?a:a.filter(x=>!['Indicadores','Conciliación','Reservas'].includes(x))}
function rows(data){return data.map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+v+'</b></div>').join('')}
function draw(){const pro=detail.checked,sim=env.checked;document.body.className=(pro?'pro ':'')+(sim?'shadow':'');let a=available(),p=chosen[section];if(!a.includes(p))p=a[0];let deep=section==='Modos'&&p!=='General';if(!levels().includes(inner))inner='Estado';let title=deep?p:section,btc=asset==='BTC',price=btc?'61.200':'1.750',target=btc?'59.400':'1.690',hold=sim?'2.100':'3.000',cash=sim?'900':'2.000',total=sim?'3.000':'5.000',contents='',controls='';
const headline=(s,n)=>'<small>'+s+'</small><div class="metric">'+n+'</div>';
const graph='<svg role="img" aria-label="Serie ilustrativa de precios" viewBox="0 0 300 104"><path fill="none" stroke="#bad0ca" d="M0 25H300M0 55H300M0 85H300"/><path fill="none" stroke="#187866" stroke-width="3" d="M0 78L18 69 32 76 48 55 66 64 81 48 98 60 114 40 131 47 149 32 165 43 182 23 200 36 216 30 232 42 253 17 274 25 300 10"/></svg>';
if(deep){controls='<nav class="tabs" aria-label="Dentro del modo">'+buttons(levels(),inner,'deeper')+'</nav>';let message={IDCA:'Espera una caída hasta la zona de entrada.',SPOT:'Espera confirmación al cierre de la vela.',GRID:'Vigila el siguiente tramo de la rejilla.',AMA:'Espera una mejora del contexto macro.'}[p];contents=inner==='Estado'?'<small>BTC / USD · Estado del modo</small><h2>'+message+'</h2>'+ (p==='IDCA'||p==='GRID'?'<div class="rail"></div>'+rows([['Zona de compra','59.400 USD'],['Precio actual','61.200 USD'],[p==='GRID'?'Venta del tramo':'Objetivo del ciclo','62.300 USD']]):rows([['Condición pendiente',p==='SPOT'?'Cierre sobre resistencia':'Sesgo favorable'],['Última evaluación','14:04']])):rows(inner==='Posiciones'?[['BTC / USD',sim?'1 simulada':'0 abiertas']]:inner==='Historial'?[['Último ciclo','Cerrado ayer']]:[['Órdenes pendientes','0']])}
else if(section==='Modos')contents='<h2>Estado de los modos</h2>'+rows([['IDCA','Espera caída'],['SPOT','Espera cierre'],['GRID','Vigila niveles'],['AMA','Observando']]);
else if(section==='Mercado'){controls='<label>Par de mercado<select onchange="asset=this.value;draw()"><option>'+asset+'</option><option>'+(btc?'ETH':'BTC')+'</option></select></label>';contents=p==='Niveles'?rows([['Soporte',target+' USD'],['Resistencia',(btc?'62.300':'1.820')+' USD']]):p==='Indicadores'?rows([['RSI',btc?'54':'48'],['Tendencia','Lateral']]):headline(asset+' / USD',price+' $')+(p==='Gráfico'?graph+'<small>Últimas 24 horas · serie de ejemplo</small>':rows([['Variación diaria',btc?'+1,2 %':'−0,4 %']]))}
else if(section==='Cartera'){contents=p==='Resumen'?headline(sim?'Capital simulado':'Valoración del exchange',total+' $')+rows([['En activos',hold+' $'],['En efectivo',cash+' $']]):rows(({Saldos:[['Activos digitales',hold+' $'],['USD',cash+' $']],Activos:[['BTC',sim?'70 %':'60 %'],['USD',sim?'30 %':'40 %']],Movimientos:[['Compra de BTC',sim?'−210 USD':'−300 USD']],Reservas:[['Efectivo disponible',cash+' $']],Conciliación:[['Última comparación','14:04'],['Diferencia','0 USD']]}[p]))}
else if(section==='Actividad'){controls='<label>Filtrar por modo<select onchange="filter=this.value;draw()">'+['Todos',...pages.Modos.slice(1)].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';let events=[['IDCA','Decisiones','El precio sigue por encima del nivel de entrada.'],['GRID','Ejecuciones',sim?'Se simuló una compra del tramo 2.':'Se completó la compra del tramo 2.'],['SPOT','Avisos','Faltan velas para actualizar la tendencia.'],['AMA','Decisiones','El contexto sigue neutral.']].filter(([m,t])=>(filter==='Todos'||filter===m)&&(p==='Recientes'||t===p));contents=events.map(([m,t,s])=>'<small>'+m+' · '+t+'</small><p>'+s+'</p>').join('')||'Sin avisos para esta selección.'}
else contents=p==='Resumen'?headline('Patrimonio de muestra',total+' $')+rows([['Posiciones abiertas',sim?'2':'1'],['Última lectura','14:04']]):rows(p==='Posiciones'?[['GRID · BTC/USD','1 abierta'],...(sim?[['IDCA · BTC/USD','1 simulada']]:[])]:[['Fuente prevista','Market Data del bot'],['Conexión del prototipo','Sin conexión al VPS']]);
app.innerHTML='<div class="path">Prototipo · Datos de muestra</div><h1>'+section+'</h1><nav class="tabs" aria-label="Submenú de '+section+'">'+buttons(a,p,'sub')+'</nav>'+(deep?'<h2>'+title+'</h2>':'')+controls+'<article class="pane"><small>'+section+' / '+p+(deep?' / '+inner:'')+'</small>'+contents+'</article>';nav.innerHTML=names.map((x,i)=>'<button class="'+(x===section?'active':'')+'" onclick="go('+i+')"><i aria-hidden="true">'+icons[i]+'</i>'+x+'</button>').join('')}
const baseDraw=draw;let depth=0;
function move(i){if(!depth){section=names[i];chosen[section]=available()[0];depth=1}else if(depth===1){chosen[section]=available()[i];inner='Estado';if(section==='Modos'&&chosen.Modos!=='General')depth=2}else inner=levels()[i];draw();scrollTo(0,0)}
function up(){depth=Math.max(0,depth-1);if(depth===1&&section==='Modos')chosen.Modos='General';draw();scrollTo(0,0)}
function rootMenu(){depth=0;draw();scrollTo(0,0)}
draw=function(){baseDraw();app.querySelectorAll('.tabs').forEach(e=>e.remove());let items=depth===2?levels():depth===1?available():names;
if(!depth){section='Inicio';chosen.Inicio='Resumen';baseDraw();app.querySelectorAll('.tabs').forEach(e=>e.remove())}
nav.style.gridTemplateColumns='repeat('+Math.min(items.length,items.length>5?3:5)+',minmax(0,1fr))';nav.setAttribute('aria-label',depth===2?chosen.Modos:depth===1?section:'Menú principal');nav.innerHTML=buttons(items,depth===2?inner:depth===1?chosen[section]:'','move');back.hidden=!depth};
draw()</script></html>
